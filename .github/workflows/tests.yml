name: Tests

# Manual-only test run. Not wired into the deploy workflows.
#
# History: on 2026-09-03 commit 45a6ebf deleted the RecordType.TenderEnquiry entry from
# AiRegistryDriftCheck.Reachability while the enum member stayed. AiRegistryDriftCheck.Assert()
# runs at boot and throws on drift, so the isolated worker died on startup and every /api/* route
# returned 500 (including sign-in) until it was found by hand. The entry was restored in c8b6a9f.
#
# This workflow was briefly used as a `needs: test` gate on the three deploy workflows the same
# evening, but the suite is red on the ubuntu runner while green on Windows (suspected font /
# platform difference in the PDF layout tests), which turned every deploy run red even though
# the deploys themselves succeeded. The gate was removed on 2026-09-04 and the deploy workflows
# put back to how they were. Run this by hand from the Actions tab when you want the suite's
# verdict from a Linux runner; re-gate the deploys only once it is green here.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run test suite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: >
          dotnet test tests/Jewel.JPMS.Tests/Jewel.JPMS.Tests.csproj
          -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results
          retention-days: 14
