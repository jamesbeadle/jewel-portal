name: Deploy JPMS MCP host to Azure Functions

# The MCP connector endpoint (/api/mcp) runs on a standalone Function App, NOT through the
# Static Web App: SWA strips the client's Authorization header before it reaches managed
# functions (github.com/Azure/static-web-apps issues 158 & 275), so bearer-authenticated MCP
# calls can never work there. This deploys the SAME api project to that host; the OAuth flow
# and the portal itself keep deploying through jpms-swa.yml. Provisioning:
# infra/azure-mcp-host-setup.sh. Details: docs/ai/10-mcp-connector.md §2.
#
# Required repository configuration:
#   - Variable  JPMS_MCP_APP_NAME                     = the Function App name in Azure
#   - Secret    AZURE_FUNCTIONAPP_PUBLISH_PROFILE_MCP = the app's publish profile

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'contracts/**'
      - '.github/workflows/jpms-mcp.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy MCP host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish api
        run: dotnet publish api/JpmsApi.csproj -c Release -o ./mcp-publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.JPMS_MCP_APP_NAME }}
          package: ./mcp-publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_MCP }}
