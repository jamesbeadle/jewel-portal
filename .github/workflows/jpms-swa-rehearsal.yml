name: 'Rehearsal: portal frontend to the "upgrade" preview environment'

# TEMPORARY (Step 3 of infra/hosting-upgrade/README.md). Publishes the current frontend to a named
# Static Web Apps preview environment with NO managed API, so the new Function App can be linked to
# that environment and tested without touching production. Manual trigger only. Delete this file
# once Gate 3 has passed.

on:
  workflow_dispatch:

jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    name: Publish preview environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tailwind dependencies
        working-directory: jpms
        run: npm install --no-audit --no-fund

      - name: Restore Blazor dependencies
        run: dotnet restore jpms/Jewel.JPMS.csproj

      - name: Publish Blazor WASM bundle
        run: dotnet publish jpms/Jewel.JPMS.csproj -c Release -o publish --no-restore

      - name: Deploy to the "upgrade" preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          api_location: ''
          output_location: ''
          skip_app_build: true
          deployment_environment: upgrade
