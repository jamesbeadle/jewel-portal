name: Deploy JPMS to Azure Static Web Apps

# Only a push to main deploys (2026-09-24, the MD: a pull request must never put a build
# anywhere). A pull request is BUILT — the Blazor bundle published and the API compiled — so its
# checks say whether it compiles, and nothing is uploaded: Azure's per-PR preview environments
# share the live site's settings, and so the production database. The close job stays only to
# tear down any preview left over from before this change.

on:
  push:
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'jpms/**'
      - 'api/**'
      - '.github/workflows/jpms-swa.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'contracts/**'
      - 'jpms/**'
      - 'api/**'

concurrency:
  group: jpms-swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tailwind dependencies
        working-directory: jpms
        run: npm install --no-audit --no-fund

      - name: Restore Blazor dependencies
        run: dotnet restore jpms/Jewel.JPMS.csproj

      - name: Publish Blazor WASM bundle
        run: dotnet publish jpms/Jewel.JPMS.csproj -c Release -o publish --no-restore

      - name: Build the API (pull requests only — the compile check; main is built by the deploy)
        if: github.event_name == 'pull_request'
        run: dotnet build api/JpmsApi.csproj -c Release

      - name: Deploy to Static Web Apps
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          api_location: api
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull-request preview

    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
