# Installed by the project-process kit (re-run its bootstrap to refresh; do not edit by hand).
# Measures the code against tools/refactor/rules.json and fails any change that makes a
# ratcheted figure worse than tools/refactor/baseline.json. The baseline moves only when a
# refactor round resets it. Your Business Today counts the pushes to the default branch and
# raises the rounds; this workflow is the line those rounds hold.
name: code-audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jscpd for the duplication check
        run: npm install -g jscpd
      - name: Run the audit
        run: python3 -m tools.refactor.audit.run_audit . --output tools/refactor/audit-output
      - name: Hold the line against the baseline
        run: python3 -m tools.refactor.audit.gate tools/refactor/baseline.json tools/refactor/audit-output/audit.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-report
          path: tools/refactor/audit-output/audit-report.md
          retention-days: 30
